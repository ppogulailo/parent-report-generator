# fly.toml app configuration file generated for parent-report-generator-api on 2026-04-15T22:50:18+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parent-report-generator-api'
primary_region = 'iad'

[build]
  [build.args]
    # Chromium renders the saved plan's PDF. Build with 'false' and set
    # PDF_ENABLED = 'false' to run without it (drop memory to 512mb to match).
    INCLUDE_CHROMIUM = 'true'

[env]
  PORT = '8080'
  PDF_ENABLED = 'true'
  CHROMIUM_PATH = '/usr/bin/chromium-browser'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm so report generation never stalls on a cold start.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 512mb is enough for the API alone, but Chromium needs headroom to render a
  # PDF — same sizing as the Sustaining Recovery FRAAP.
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
