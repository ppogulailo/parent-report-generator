# fly.toml app configuration file generated for parent-report-generator-frontend on 2026-04-15T22:59:21+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parent-report-generator-frontend'
primary_region = 'iad'

[build]

  [build.args]
    # Set to 'https://monitoring.asapcommunity.org' at launch, once the DNS
    # record exists. Build-time only, so the frontend must be redeployed with
    # --no-cache for a change here to take effect.
    NEXT_PUBLIC_SITE_URL = 'https://monitoring.asapcommunity.org'
    # '1' since 2026-09-02: parents get the Version 1.0 flow at /[lang].
    # Flipped on Matt's go-ahead after the matrix approval, the Spanish
    # sign-off, and the final eight-plan real-model verification. Setting this
    # back to '0' (and redeploying with --no-cache) restores the old flow —
    # that reversibility is the point of the flag.
    NEXT_PUBLIC_V1_DEFAULT = '1'

[env]
  HOSTNAME = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm so the questionnaire and proxy never stall on a cold start.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
